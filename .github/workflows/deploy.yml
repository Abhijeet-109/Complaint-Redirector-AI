
name: Flatkart CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatkart-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 45m
          script_stop: true
          script: |
            set -e

            cd /opt/flatkart/source

            # Update production source from GitHub
            git fetch origin main
            git reset --hard origin/main

            # Preserve the currently running backend image for rollback
            sudo docker image tag flatkart-backend:latest flatkart-backend:rollback

            # Build backend image
            sudo docker build -f backend/Dockerfile -t flatkart-backend:latest .

            # Build frontend
            cd /opt/flatkart/source/frontend
            npm install
            npm run build

            # Replace backend container
            sudo docker stop flatkart-backend
            sudo docker rm flatkart-backend

            sudo docker run -d \
              --name flatkart-backend \
              --restart unless-stopped \
              --network flatkart-net \
              -p 127.0.0.1:8000:8000 \
              --env-file /opt/flatkart/backend.env \
              -v /opt/flatkart/persistent/uploads:/app/backend/uploads \
              flatkart-backend:latest

            # Verify backend startup
            READY=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null; then
                READY=1
                break
              fi
              sleep 5
            done

            # Roll back backend if startup fails
            if [ "$READY" -ne 1 ]; then
              sudo docker logs --tail 100 flatkart-backend
              sudo docker rm -f flatkart-backend || true

              sudo docker run -d \
                --name flatkart-backend \
                --restart unless-stopped \
                --network flatkart-net \
                -p 127.0.0.1:8000:8000 \
                --env-file /opt/flatkart/backend.env \
                -v /opt/flatkart/persistent/uploads:/app/backend/uploads \
                flatkart-backend:rollback

              exit 1
            fi

            # Publish frontend
            sudo cp -a /opt/flatkart/source/frontend/dist/. /var/www/flatkart/

            # Verify and reload Nginx
            sudo nginx -t
            sudo systemctl reload nginx

            echo "Flatkart deployment completed successfully."
